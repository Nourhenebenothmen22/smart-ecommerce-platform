upstream backend {
    server backend:5000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # API → Backend (port 5000)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ML health check (exposed via backend)
    location /health {
        proxy_pass http://backend/api/health;
        proxy_set_header Host $host;
    }

    # Gateway Status
    location / {
        default_type application/json;
        return 200 '{"service":"DarStore API Gateway","status":"online","routes":{"api":"/api/","health":"/health","frontend":"http://localhost:5173","backend_docs":"http://localhost:5000/api-docs","ml_docs":"http://localhost:8000/docs"}}\n';
    }
}
