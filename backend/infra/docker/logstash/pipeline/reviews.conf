input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/ecommerce_ml_db"
    jdbc_user => "postgres"
    jdbc_password => "postgres"
    schedule => "* * * * *"
    use_column_value => true
    tracking_column => "id"
    tracking_column_type => "numeric"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_reviews"
    statement => "SELECT id, product_id, user_id, rating, review_text, verified_purchase, created_at FROM reviews WHERE id > :sql_last_value ORDER BY id ASC"
    type => "review"
  }
}

output {
  if [type] == "review" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "reviews"
      document_id => "%{id}"
    }
  }
}
