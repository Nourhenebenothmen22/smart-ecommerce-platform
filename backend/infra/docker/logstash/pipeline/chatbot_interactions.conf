input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/ecommerce_ml_db"
    jdbc_user => "postgres"
    jdbc_password => "postgres"
    schedule => "* * * * *"
    use_column_value => true
    tracking_column => "id"
    tracking_column_type => "numeric"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_chatbot"
    statement => "SELECT id, user_id, session_id, user_query, retrieval_algorithm, retrieved_context, llm_prompt, llm_response, llm_model_used, execution_time_ms, user_feedback_score, created_at FROM chatbot_interactions WHERE id > :sql_last_value ORDER BY id ASC"
    type => "chatbot"
  }
}

output {
  if [type] == "chatbot" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "chatbot_interactions"
      document_id => "%{id}"
    }
  }
}
