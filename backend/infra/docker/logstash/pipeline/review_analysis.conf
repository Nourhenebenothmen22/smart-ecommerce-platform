input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/ecommerce_ml_db"
    jdbc_user => "postgres"
    jdbc_password => "postgres"
    schedule => "* * * * *"
    use_column_value => true
    tracking_column => "id"
    tracking_column_type => "numeric"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_review_analysis"
    statement => "SELECT id, review_id, sentiment_label as status, sentiment_score, keywords::TEXT, topics::TEXT, model_name, model_version, created_at FROM review_analysis WHERE id > :sql_last_value ORDER BY id ASC"
    type => "review_analysis"
  }
}

output {
  if [type] == "review_analysis" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "review_analysis"
      document_id => "%{id}"
    }
  }
}
