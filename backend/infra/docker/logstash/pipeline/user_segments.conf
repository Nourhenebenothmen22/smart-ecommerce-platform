input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/ecommerce_ml_db"
    jdbc_user => "postgres"
    jdbc_password => "postgres"
    schedule => "* * * * *"
    use_column_value => true
    tracking_column => "id"
    tracking_column_type => "numeric"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_segments"
    statement => "SELECT id, user_id, segment_id, segment_label, model_name, model_version, confidence, computed_at FROM user_segments WHERE id > :sql_last_value ORDER BY id ASC"
    type => "segment"
  }
}

output {
  if [type] == "segment" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "user_segments"
      document_id => "%{id}"
    }
  }
}
