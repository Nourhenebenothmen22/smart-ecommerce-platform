input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/ecommerce_ml_db"
    jdbc_user => "postgres"
    jdbc_password => "postgres"
    schedule => "* * * * *"
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_orders"
    statement => "SELECT id, user_id, status, total_amount, payment_status, created_at, updated_at FROM orders WHERE updated_at > :sql_last_value AND updated_at < NOW() ORDER BY updated_at ASC"
    type => "order"
  }
}

output {
  if [type] == "order" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "orders"
      document_id => "%{id}"
    }
  }
}
