input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/ecommerce_ml_db"
    jdbc_user => "postgres"
    jdbc_password => "postgres"
    schedule => "* * * * *"
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_products"
    statement => "SELECT id, title, slug, description, brand, category_id, subcategory_id, price, discount_percent, final_price, rating_avg, review_count, stock, thumbnail, images, tags, is_active, created_at, updated_at FROM products WHERE updated_at > :sql_last_value AND updated_at < NOW() ORDER BY updated_at ASC"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "products"
    document_id => "%{id}"
  }
}
