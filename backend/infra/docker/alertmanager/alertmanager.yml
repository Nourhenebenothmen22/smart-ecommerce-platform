  #   from: tonemail@outlook.com
  smarthost: "smtp.gmail.com:587"
  auth_username: "benothmennourhen8@gmail.com"
  auth_password: "ugxl pgcz upnu xhmn"
  from: "benothmennourhen8@gmail.com"

route:
  receiver: "email-admin"
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: "email-admin"
      matchers:
        - severity = "critical"
      repeat_interval: 30m
    - receiver: "email-admin"
      matchers:
        - severity = "warning"
      repeat_interval: 2h

receivers:
  - name: "email-admin"
    email_configs:
      - to: "benothmennourhen8@gmail.com"
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] E-Commerce - {{ .GroupLabels.alertname }}'
        html: |
          <h2>{{ .GroupLabels.alertname }}</h2>
          <p><strong>Statut :</strong> {{ .Status }}</p>
          <hr>
          {{ range .Alerts }}
            <h3>{{ .Annotations.summary }}</h3>
            <p>{{ .Annotations.description }}</p>
            <table border="1" cellpadding="6" style="border-collapse:collapse;font-family:monospace;">
              <tr><td>Sévérité</td><td>{{ .Labels.severity }}</td></tr>
              <tr><td>Début</td><td>{{ .StartsAt.Format "02/01/2006 15:04:05" }}</td></tr>
              {{ if .Value }}<tr><td>Valeur</td><td>{{ .Value }}</td></tr>{{ end }}
            </table>
            <hr>
          {{ end }}
          <p><small>Alertmanager - E-Commerce Intelligent Platform</small></p>
