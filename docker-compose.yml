services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce_ml_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - ecommerce_network

  # ── Application ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecommerce_backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/${DB_NAME:-ecommerce_ml_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?ML_SERVICE_TOKEN is required}
      ML_REQUIRE_SERVICE_TOKEN: "true"
      ML_REQUEST_TIMEOUT_MS: ${ML_REQUEST_TIMEOUT_MS:-5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5000}
      RETELL_API_KEY: ${RETELL_API_KEY:-}
      RETELL_AGENT_ID: ${RETELL_AGENT_ID:-}
      RETELL_FROM_NUMBER: ${RETELL_FROM_NUMBER:-}
      RETELL_WEBHOOK_SECRET: ${RETELL_WEBHOOK_SECRET:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
    command: ${DEV_CMD:-node dist/server.js}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: ecommerce_ml
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_ml_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      APP_ENV: development
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?ML_SERVICE_TOKEN is required}
      ML_REQUIRE_SERVICE_TOKEN: "true"
      ML_CORS_ORIGINS: http://backend:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      ML_ENABLE_LLM_CALLS: ${ML_ENABLE_LLM_CALLS:-true}
      ML_ALLOW_MODEL_DOWNLOADS: ${ML_ALLOW_MODEL_DOWNLOADS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce_network

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge

volumes:
  postgres_data:
