services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce_ml_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: ecommerce_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ecommerce_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: ecommerce_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles:
      - debug
    networks:
      - ecommerce_network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: ecommerce_logstash
    volumes:
      - ./backend/infra/docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./backend/infra/docker/logstash/drivers/postgresql.jar:/usr/share/logstash/postgresql.jar:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ecommerce_ml_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASS:-postgres}
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./backend/infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/infra/docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ecommerce_network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ecommerce_alertmanager
    restart: always
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./backend/infra/docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./backend/infra/docker/alertmanager/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      - SMTP_SMARTHOST=${ALERTMANAGER_SMTP_HOST:-smtp.gmail.com:587}
      - SMTP_FROM=${ALERTMANAGER_SMTP_FROM:-}
      - SMTP_AUTH_USERNAME=${ALERTMANAGER_SMTP_USER:-}
      - SMTP_AUTH_PASSWORD=${ALERTMANAGER_SMTP_PASSWORD:-}
      - ALERTMANAGER_RECEIVER_EMAIL=${ALERTMANAGER_RECEIVER_EMAIL:-benothmennourhen8@gmail.com}
    command:
      - "--config.file=/tmp/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - ecommerce_network

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./backend/infra/docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./backend/infra/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
    networks:
      - ecommerce_network

  # ── Application ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecommerce_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/${DB_NAME:-ecommerce_ml_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?ML_SERVICE_TOKEN is required}
      ML_REQUIRE_SERVICE_TOKEN: "true"
      ML_REQUEST_TIMEOUT_MS: ${ML_REQUEST_TIMEOUT_MS:-5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RETELL_API_KEY: ${RETELL_API_KEY:-}
      RETELL_AGENT_ID: ${RETELL_AGENT_ID:-}
      RETELL_FROM_NUMBER: ${RETELL_FROM_NUMBER:-}
      RETELL_WEBHOOK_SECRET: ${RETELL_WEBHOOK_SECRET:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:5000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: ecommerce_ml
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_ml_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      APP_ENV: production
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?ML_SERVICE_TOKEN is required}
      ML_REQUIRE_SERVICE_TOKEN: "true"
      ML_CORS_ORIGINS: http://backend:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      ML_ENABLE_LLM_CALLS: ${ML_ENABLE_LLM_CALLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce_network

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - ecommerce_network

networks:
  ecommerce_network:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
